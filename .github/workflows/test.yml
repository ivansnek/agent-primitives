name: test

on:
  push:
  pull_request:

jobs:
  test:
    # The herd engine suite assumes macOS path canonicalization (/var -> /private/var).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure jq and bash >= 4.4
        run: |
          command -v jq || brew install jq
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Tests
        run: bash tests/run.sh
      - name: Leak check
        run: scripts/check-generic.sh
